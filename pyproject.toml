[project]
name = "castostudio-ai-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "castostudio-ai-core",
    "castostudio-ai-server",
    "castostudio-ai-podcast",
    "ultralytics>=8.3.0",
    "opencv-python>=4.10.0",
    "mss>=10.2.0",
    "pyobjc-framework-quartz>=12.2.2; sys_platform == 'darwin'",
]

[tool.uv.workspace]
members = [
  "core",
  "server",
  "packages/football",
  "packages/podcast",
]

[tool.uv.sources]
castostudio-ai-core = { workspace = true }
castostudio-ai-server = { workspace = true }
castostudio-ai-football = { workspace = true }
castostudio-ai-podcast = { workspace = true }

[dependency-groups]
dev = [
  "grpcio-tools>=1.73.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
